name: Verify demo
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --json > audit.json
        continue-on-error: true
      - run: node -e "const a=require('./audit.json'); for(const [n,v] of Object.entries(a.vulnerabilities||{})) console.log(n,v.severity,JSON.stringify(v.fixAvailable))"
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results
            package-lock.json
            audit.json
            dist
